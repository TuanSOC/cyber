# Prod-like override: built images, no bind mounts, secure cookies, TLS at the gateway.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

# Threat intel in prod (M4): no mock sink, and a real seal key pair. Settings refuses a
# `dev-` kid in prod, so generate one first: scripts/gen_ti_seal_keys.py writes
# .secrets/ti_seal_private.json and prints the two TI_PROD_* lines for .env.
x-prod-ti: &prod-ti
  TI_MOCK_ENABLED: "false"
  TI_SEAL_ACTIVE_KID: ${TI_PROD_SEAL_ACTIVE_KID:?run scripts/gen_ti_seal_keys.py and set TI_PROD_SEAL_ACTIVE_KID}
  TI_SEAL_PUBLIC_KEYS: ${TI_PROD_SEAL_PUBLIC_KEYS:?run scripts/gen_ti_seal_keys.py and set TI_PROD_SEAL_PUBLIC_KEYS}

# AI analyst in prod (M5): no ai-mock, no platform key, and a real AI seal key pair
# (scripts/gen_ai_seal_keys.py writes .secrets/ai_seal_private.json and prints the two
# AI_PROD_* lines for .env). Settings refuses a `dev-` kid and the committed dev key.
x-prod-ai: &prod-ai
  AI_MOCK_ENABLED: "false"
  AI_PLATFORM_PROVIDER: ""
  AI_SEAL_ACTIVE_KID: ${AI_PROD_SEAL_ACTIVE_KID:?run scripts/gen_ai_seal_keys.py and set AI_PROD_SEAL_ACTIVE_KID}
  AI_SEAL_PUBLIC_KEYS: ${AI_PROD_SEAL_PUBLIC_KEYS:?run scripts/gen_ai_seal_keys.py and set AI_PROD_SEAL_PUBLIC_KEYS}

# Report signing in prod (M6): a real Ed25519 pair. scripts/gen_report_signing_keys.py writes
# .secrets/report_signing_private.json (the api's secret) and prints the two REPORT_PROD_*
# lines for .env. Settings refuses a `dev-` kid and the committed dev public key.
x-prod-report-signing: &prod-report-signing
  REPORT_SIGNING_ACTIVE_KID: ${REPORT_PROD_SIGNING_ACTIVE_KID:?run scripts/gen_report_signing_keys.py and set REPORT_PROD_SIGNING_ACTIVE_KID}
  REPORT_SIGNING_PUBLIC_KEYS: ${REPORT_PROD_SIGNING_PUBLIC_KEYS:?run scripts/gen_report_signing_keys.py and set REPORT_PROD_SIGNING_PUBLIC_KEYS}

# Platform operations in prod (M7): the retention role, broker and purge passwords are
# required (no change-me defaults), and the KMS key and metrics token come from .secrets/.
x-prod-retention: &prod-retention
  ENV: prod
  DATABASE_URL: postgresql+asyncpg://cyberlab_retention:${POSTGRES_RETENTION_PASSWORD:?set POSTGRES_RETENTION_PASSWORD}@postgres:5432/cyberlab
  BROKER_URL: redis://retention:${BROKER_RETENTION_PASSWORD:?set BROKER_RETENTION_PASSWORD}@redis-broker:6379/0
  MINIO_PURGE_SECRET_KEY: ${MINIO_PURGE_SECRET_KEY:?set MINIO_PURGE_SECRET_KEY}

# Identity and access in prod (M11): real identity and mail seal key pairs
# (scripts/gen_identity_seal_keys.py and scripts/gen_mail_seal_keys.py write
# .secrets/{identity,mail}_seal_private.json and print the *_PROD_* lines for .env), the https
# origin of invitation and reset links, and `invite_only` registration by default (the first
# owner: `pnpm identity:admin bootstrap-owner`, RT12). Settings refuses `dev-` kids and the
# committed dev keys, `MAIL_TRANSPORT=capture` and the dev escape hatches.
x-prod-identity: &prod-identity
  IDENTITY_SEAL_ACTIVE_KID: ${IDENTITY_PROD_SEAL_ACTIVE_KID:?run scripts/gen_identity_seal_keys.py and set IDENTITY_PROD_SEAL_ACTIVE_KID}
  IDENTITY_SEAL_PUBLIC_KEYS: ${IDENTITY_PROD_SEAL_PUBLIC_KEYS:?run scripts/gen_identity_seal_keys.py and set IDENTITY_PROD_SEAL_PUBLIC_KEYS}
  MAIL_SEAL_ACTIVE_KID: ${MAIL_PROD_SEAL_ACTIVE_KID:?run scripts/gen_mail_seal_keys.py and set MAIL_PROD_SEAL_ACTIVE_KID}
  MAIL_SEAL_PUBLIC_KEYS: ${MAIL_PROD_SEAL_PUBLIC_KEYS:?run scripts/gen_mail_seal_keys.py and set MAIL_PROD_SEAL_PUBLIC_KEYS}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL (the https origin of invitation and reset links)}
  REGISTRATION_MODE: ${REGISTRATION_MODE:-invite_only}

services:
  minio:
    ports: !reset []

  # M11: the dev mail sink never runs in prod (the mail worker delivers to the relay).
  mailpit:
    profiles: ["dev-mail-sink"]

  # M11 mail worker in prod: prod image, its own DB and broker passwords required, the relay
  # over `egress` with TLS (Settings refuses SMTP_TLS=none and a missing MAIL_FROM in prod).
  mail-worker:
    image: cyberlab/api:prod
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://cyberlab_mail:${POSTGRES_MAIL_PASSWORD:?set POSTGRES_MAIL_PASSWORD}@postgres:5432/cyberlab
      BROKER_URL: redis://mail:${BROKER_MAIL_PASSWORD:?set BROKER_MAIL_PASSWORD}@redis-broker:6379/0
      MAIL_TRANSPORT: smtp
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST (the operator's relay)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
    secrets: [mail_seal_private, smtp_password]
    networks: !override [enrich, egress]
    volumes: !reset []
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy

  # M11 egress proxy in prod: prod image, no source mount (it holds no secret at all).
  egress-proxy:
    image: cyberlab/api:prod
    environment:
      ENV: prod
    volumes: !reset []

  postgres:
    environment:
      POSTGRES_RETENTION_PASSWORD: ${POSTGRES_RETENTION_PASSWORD:?set POSTGRES_RETENTION_PASSWORD}
      POSTGRES_MAIL_PASSWORD: ${POSTGRES_MAIL_PASSWORD:?set POSTGRES_MAIL_PASSWORD}

  db-bootstrap:
    environment:
      POSTGRES_RETENTION_PASSWORD: ${POSTGRES_RETENTION_PASSWORD:?set POSTGRES_RETENTION_PASSWORD}
      POSTGRES_MAIL_PASSWORD: ${POSTGRES_MAIL_PASSWORD:?set POSTGRES_MAIL_PASSWORD}

  minio-init:
    environment:
      ENV: prod
      MINIO_PURGE_SECRET_KEY: ${MINIO_PURGE_SECRET_KEY:?set MINIO_PURGE_SECRET_KEY}

  # The retention worker in prod: prod image, ENV=prod, its own passwords required; still no
  # JWT secret, app Redis, api MinIO user or key material.
  retention-worker:
    image: cyberlab/api:prod
    environment: *prod-retention
    volumes: !reset []

  migrate:
    image: cyberlab/api:prod
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    volumes: !reset []

  api:
    image: cyberlab/api:prod
    build:
      context: ./apps/api
      target: prod
    environment:
      <<: [*prod-ti, *prod-ai, *prod-report-signing, *prod-identity]
      ENV: prod
      COOKIE_SECURE: "true"
    volumes: !override
      - upload_tmp:${UPLOAD_TMP_DIR}

  ingest-worker:
    image: cyberlab/api:prod
    environment:
      <<: [*prod-ti, *prod-ai]
      ENV: prod
      COOKIE_SECURE: "true"
    volumes: !override
      - ingest_tmp:/var/lib/cyberlab/ingest-tmp

  # M9 (RT9): the disk ingest worker in prod, like the ingest worker.
  disk-ingest-worker:
    image: cyberlab/api:prod
    environment:
      <<: [*prod-ti, *prod-ai]
      ENV: prod
      COOKIE_SECURE: "true"
    volumes: !override
      - ingest_tmp:/var/lib/cyberlab/ingest-tmp

  ingest-beat:
    image: cyberlab/api:prod
    environment:
      <<: [*prod-ti, *prod-ai]
      ENV: prod
      COOKIE_SECURE: "true"
    volumes: !reset []

  # Without this entry the worker would run the dev image in dev mode (.env has ENV=dev),
  # with the mock and the dev-only MISP flags allowed (M4 RT3).
  enrich-worker:
    image: cyberlab/api:prod
    environment:
      <<: *prod-ti
      ENV: prod
    volumes: !reset []

  # The AI analyst worker in prod: prod image, ENV=prod (mock refused), its own broker
  # password required, two replicas (the DB lease keeps them safe, M5 RT2).
  analyst-worker:
    image: cyberlab/api:prod
    environment:
      <<: *prod-ai
      ENV: prod
      BROKER_URL: redis://analyst:${BROKER_ANALYST_PASSWORD:?set BROKER_ANALYST_PASSWORD}@redis-broker:6379/0
    volumes: !reset []
    deploy:
      replicas: 2

  redis-broker:
    environment:
      BROKER_ANALYST_PASSWORD: ${BROKER_ANALYST_PASSWORD:?set BROKER_ANALYST_PASSWORD}
      BROKER_REPORT_PASSWORD: ${BROKER_REPORT_PASSWORD:?set BROKER_REPORT_PASSWORD}
      BROKER_RETENTION_PASSWORD: ${BROKER_RETENTION_PASSWORD:?set BROKER_RETENTION_PASSWORD}
      BROKER_MEMORY_PASSWORD: ${BROKER_MEMORY_PASSWORD:?set BROKER_MEMORY_PASSWORD}
      BROKER_DISK_PASSWORD: ${BROKER_DISK_PASSWORD:?set BROKER_DISK_PASSWORD}
      BROKER_REVERSE_PASSWORD: ${BROKER_REVERSE_PASSWORD:?set BROKER_REVERSE_PASSWORD}
      BROKER_MAIL_PASSWORD: ${BROKER_MAIL_PASSWORD:?set BROKER_MAIL_PASSWORD}

  # The report renderer in prod (M6): prod image, ENV=prod, its own broker password required;
  # still no DB, MinIO credentials or signing material.
  report-worker:
    image: cyberlab/report-worker:prod
    build:
      context: ./apps/workers/report
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
    environment:
      ENV: prod
      BROKER_URL: redis://report:${BROKER_REPORT_PASSWORD:?set BROKER_REPORT_PASSWORD}@redis-broker:6379/0
    volumes: !reset []

  static-worker:
    image: cyberlab/static-worker:prod
    build:
      context: ./apps/workers/static
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
    volumes: !override
      - static_work:/work

  # The memory analyzer in prod (M8): prod image (no tests or samples), its own broker password
  # required, no source bind mount; the symbol store stays read-only.
  memory-worker:
    image: cyberlab/memory-worker:prod
    build:
      context: ./apps/workers/memory
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
    environment:
      BROKER_URL: redis://memory:${BROKER_MEMORY_PASSWORD:?set BROKER_MEMORY_PASSWORD}@redis-broker:6379/0
    volumes: !override
      - memory_work:/work
      - memory_symbols:/symbols:ro

  # The operator's symbol tool and its volume init run the prod image too (profile `tools`).
  memory-symbols:
    image: cyberlab/memory-worker:prod

  memory-symbols-init:
    image: cyberlab/memory-worker:prod

  # The disk analyzer in prod (M9): prod image (no GPL test tools, no compiler, no tests),
  # its own broker password required, no source bind mount; the hash-set store read-only.
  disk-worker:
    image: cyberlab/disk-worker:prod
    build:
      context: ./apps/workers/disk
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
        static_rules: ./apps/workers/static/rules/yara
    environment:
      BROKER_URL: redis://disk:${BROKER_DISK_PASSWORD:?set BROKER_DISK_PASSWORD}@redis-broker:6379/0
    volumes: !override
      - disk_work:/work
      - disk_hashsets:/hashsets:ro

  # The operator's hash-set tool and its volume init run the prod image too (profile `tools`).
  disk-hashsets:
    image: cyberlab/disk-worker:prod

  disk-hashsets-init:
    image: cyberlab/disk-worker:prod

  # The RE analyzer in prod (M10): prod image (no compiler, no tests, no samples), its own
  # broker password required, no source bind mount.
  re-worker:
    image: cyberlab/re-worker:prod
    build:
      context: ./apps/workers/reverse
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
    environment:
      BROKER_URL: redis://reverse:${BROKER_REVERSE_PASSWORD:?set BROKER_REVERSE_PASSWORD}@redis-broker:6379/0
    volumes: !override
      - re_work:/work

  pcap-worker:
    image: cyberlab/pcap-worker:prod
    build:
      context: ./apps/workers/pcap
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
    volumes: !override
      - pcap_work:/work

  web:
    image: cyberlab/web:prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    volumes: !reset []

  gateway:
    environment:
      # `gateway:8443` lets the e2e container reach the same site over the compose network.
      SITE_ADDRESS: ${SITE_ADDRESS}, gateway:8443
    volumes: !override
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/common.caddy:/etc/caddy/common.caddy:ro
      - caddydata:/data
    ports: !override
      - "127.0.0.1:8443:8443"

secrets:
  # From scripts/gen_ti_seal_keys.py (mode 0400, owned by uid 10001 on a Linux host).
  ti_seal_private:
    file: ./.secrets/ti_seal_private.json
  # From scripts/gen_ai_seal_keys.py (same rules).
  ai_seal_private:
    file: ./.secrets/ai_seal_private.json
  # From scripts/gen_report_signing_keys.py (the api only; same rules).
  report_signing_private:
    file: ./.secrets/report_signing_private.json
  # M7: `<name>:<base64 32 bytes>` (never the committed dev key; minio-init refuses its name).
  # Back it up encrypted with the other secrets: without it MinIO cannot read its IAM, config
  # or any SSE object (RT7).
  minio_kms_key:
    file: ./.secrets/minio_kms_key
  # M7: the bearer token of /internal/metrics (the api only).
  metrics_token:
    file: ./.secrets/metrics_token
  # M11: from scripts/gen_identity_seal_keys.py (the api only) and gen_mail_seal_keys.py (the
  # mail worker only), and the SMTP relay password (the mail worker only).
  identity_seal_private:
    file: ./.secrets/identity_seal_private.json
  mail_seal_private:
    file: ./.secrets/mail_seal_private.json
  smtp_password:
    file: ./.secrets/smtp_password

volumes:
  caddydata:
