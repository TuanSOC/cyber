# Prod-like override: built images, no bind mounts, secure cookies, TLS at the gateway.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

# Threat intel in prod (M4): no mock sink, and a real seal key pair. Settings refuses a
# `dev-` kid in prod, so generate one first: scripts/gen_ti_seal_keys.py writes
# .secrets/ti_seal_private.json and prints the two TI_PROD_* lines for .env.
x-prod-ti: &prod-ti
  TI_MOCK_ENABLED: "false"
  TI_SEAL_ACTIVE_KID: ${TI_PROD_SEAL_ACTIVE_KID:?run scripts/gen_ti_seal_keys.py and set TI_PROD_SEAL_ACTIVE_KID}
  TI_SEAL_PUBLIC_KEYS: ${TI_PROD_SEAL_PUBLIC_KEYS:?run scripts/gen_ti_seal_keys.py and set TI_PROD_SEAL_PUBLIC_KEYS}

services:
  minio:
    ports: !reset []

  migrate:
    image: cyberlab/api:prod
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    volumes: !reset []

  api:
    image: cyberlab/api:prod
    build:
      context: ./apps/api
      target: prod
    environment:
      <<: *prod-ti
      ENV: prod
      COOKIE_SECURE: "true"
    volumes: !override
      - upload_tmp:${UPLOAD_TMP_DIR}

  ingest-worker:
    image: cyberlab/api:prod
    environment:
      <<: *prod-ti
      ENV: prod
      COOKIE_SECURE: "true"
    volumes: !override
      - ingest_tmp:/var/lib/cyberlab/ingest-tmp

  ingest-beat:
    image: cyberlab/api:prod
    environment:
      <<: *prod-ti
      ENV: prod
      COOKIE_SECURE: "true"
    volumes: !reset []

  # Without this entry the worker would run the dev image in dev mode (.env has ENV=dev),
  # with the mock and the dev-only MISP flags allowed (M4 RT3).
  enrich-worker:
    image: cyberlab/api:prod
    environment:
      <<: *prod-ti
      ENV: prod
    volumes: !reset []

  static-worker:
    image: cyberlab/static-worker:prod
    build:
      context: ./apps/workers/static
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
    volumes: !override
      - static_work:/work

  pcap-worker:
    image: cyberlab/pcap-worker:prod
    build:
      context: ./apps/workers/pcap
      target: prod
      additional_contexts:
        jobs: ./packages/py-jobs
        worker_kit: ./packages/py-worker-kit
    volumes: !override
      - pcap_work:/work

  web:
    image: cyberlab/web:prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    volumes: !reset []

  gateway:
    environment:
      # `gateway:8443` lets the e2e container reach the same site over the compose network.
      SITE_ADDRESS: ${SITE_ADDRESS}, gateway:8443
    volumes: !override
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/common.caddy:/etc/caddy/common.caddy:ro
      - caddydata:/data
    ports: !override
      - "127.0.0.1:8443:8443"

secrets:
  # From scripts/gen_ti_seal_keys.py (mode 0400, owned by uid 10001 on a Linux host).
  ti_seal_private:
    file: ./.secrets/ti_seal_private.json

volumes:
  caddydata:
