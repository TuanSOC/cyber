[project]
name = "cyberlab-memory-worker"
version = "0.1.0"
description = "CyberLab memory forensics analyzer (untrusted-input worker) and the trusted memory-symbols tool"
requires-python = ">=3.12,<3.13"
# Volatility 3 is pinned exactly (a bump is a deliberate change with fixture re-checks) and
# installed WITHOUT extras: never `volatility3[full]`, `leechcorepyc` (GPLv3, live
# acquisition), `pycryptodome` (credential dumpers only), `pillow`, `pysmb` (smb:// handler),
# `yara-python` / `yara-x` (M8 runs no YARA, RT8). docker/finalize_image.py asserts the set.
dependencies = [
    "celery[redis]>=5.5",
    "httpx>=0.28",
    "pydantic>=2.9",
    "cyberlab-jobs",
    "cyberlab-worker",
    "volatility3==2.28.2",
    "pefile>=2024.8.26",
    "capstone>=5.0",
    # Without it Volatility silently skips ISF schema validation (research §7).
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "redis>=5.2",
]

[tool.uv.sources]
# The image places the contracts at /packages/py-jobs (same relative path as here).
cyberlab-jobs = { path = "../../../packages/py-jobs", editable = true }
cyberlab-worker = { path = "../../../packages/py-worker-kit", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S108", "S311"]
"samples/**" = ["S311", "S101"]
"dataset/**" = ["S311", "S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "volatility3.*", "pefile.*", "capstone.*", "jsonschema.*"]
ignore_missing_imports = true
