<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The renderer's only fonts: the bundled Noto set (M6, RT16). No user or system font
     directories, no remote fonts (`@font-face url()` never reaches the fetcher). The cache is
     built at image build time and read-only at runtime. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <config>
    <rescan><int>0</int></rescan>
  </config>
</fontconfig>
