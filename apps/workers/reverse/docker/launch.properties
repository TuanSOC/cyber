# CyberLab M10: replaces Ghidra 12.2's support/launch.properties (RT1). PyGhidra's launcher
# merges VMARGS / VMARGS_LINUX from this file into the JVM arguments; this copy carries only the
# platform defaults Ghidra needs to start (class loader, encoding, locale, headless AWT,
# TLS floor, no CDS). Heap, GC, code cache, metaspace, direct memory, stack, attach, OOM and
# error-file options are NOT here: the probe passes them (re_worker/jvm_args.py) and root
# compares the JVM's effective `getInputArguments()` with the expected list.
#
# A change here changes the sha256 recorded in /etc/cyberlab/versions.json and the expected
# list in re_worker/jvm_args.py (LAUNCH_PROPERTIES_VMARGS); test_jvm_args.py pins both.
# PROVISIONAL until the phase-2 spike confirms Ghidra 12.2 starts with exactly this set.

JAVA_HOME_OVERRIDE=/opt/java/openjdk

VMARGS=-Djava.system.class.loader=ghidra.GhidraClassLoader
VMARGS=-Dfile.encoding=UTF8
VMARGS=-Duser.country=US
VMARGS=-Duser.language=en
VMARGS=-Duser.variant=
VMARGS=-Dsun.java2d.opengl=false
VMARGS=-Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
VMARGS=-Xshare:off
VMARGS_LINUX=-Dsun.java2d.xrender=false
