[project]
name = "cyberlab-api"
version = "0.1.0"
description = "CyberLab AI API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "minio>=7.2",
    "python-magic>=0.4.27",
    "anyio>=4.6",
    "email-validator>=2.2",
    "celery[redis]>=5.5",
    "cyberlab-jobs",
    # Threat intel (M4): sealed provider keys (X25519/HKDF/AES-GCM) and provider HTTP calls.
    "cryptography>=44",
    "httpx>=0.28",
    # AI analyst (M5): official SDKs, pinned below the next major (a bump is a parent
    # decision). anthropic uses the separate httpx2 package; google-genai uses httpx.
    "anthropic>=2.5,<3",
    "google-genai>=2.34,<3",
    # Identity (M11): the OIDC client (phase 8; ID tokens are validated with PyJWT). Needs
    # `uv lock` (network) before the image rebuild; UV_FROZEN images ignore it until then.
    "authlib>=1.6,<2",
]

[tool.uv.sources]
# Shared contracts; the image places them at /packages/py-jobs (same relative path as here).
cyberlab-jobs = { path = "../../packages/py-jobs", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
    # M11 phase 5: test-only cross-check of the own RFC 6238 verifier.
    "pyotp>=2.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["metric: IOC enrichment metric harness (M4 phase 7; scripts/ti_eval.py)"]
# minio-py still calls datetime.utcnow() internally.
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:minio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# SQL identifiers interpolated from module constants / test parameters, never user input.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]
"alembic/versions/**" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["magic", "minio.*", "celery.*", "kombu.*", "asyncpg.*"]
ignore_missing_imports = true
