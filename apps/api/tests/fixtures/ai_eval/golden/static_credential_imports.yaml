case: static_credential_imports
description: "Imports credential-store and memory-dump APIs."
must_mention:
  - id: api_credential_access
    table: analysis_findings
    where: {type: "api_credential_access"}
allowed_attack: [T1555, T1555.004, T1003, T1003.001]
forbidden_terms: ["clean", "benign", "safe", "harmless", "no threat", "nothing suspicious", "ransomware"]
forbid_external_urls: true
min_recall: 1.0
fake_min_recall: 1.0
