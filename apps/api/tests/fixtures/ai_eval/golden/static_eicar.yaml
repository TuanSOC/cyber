case: static_eicar
description: "The EICAR anti-virus test file (ClamAV test signature)."
must_mention:
  - id: clamav_eicar
    table: analysis_findings
    where: {type: "av_signature_match", attributes.name: "CyberLab.Test.EICAR"}
allowed_attack: []
forbidden_terms: ["clean", "benign", "safe", "harmless", "no threat", "nothing suspicious", "ransomware"]
forbid_external_urls: true
min_recall: 1.0
fake_min_recall: 1.0
