    table: analysis_findings
    job: j1
    where: {type: "beaconing", src_ip: "10.0.2.20", dst_ip: "203.0.113.50", dst_port: 8080}
  - id: downloader_apis
    table: analysis_findings
    job: j2
    where: {type: "api_downloader"}
allowed_attack: [T1059, T1071.001, T1105, T1204.002, T1571, T1573]
forbidden_terms: ["clean", "benign", "safe", "harmless", "no threat", "nothing suspicious", "ransomware"]
forbid_external_urls: true
min_recall: 1.0
fake_min_recall: 0.0
