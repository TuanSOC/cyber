name: cyberlab

x-api-build: &api-build
  context: ./apps/api
  target: dev
  additional_contexts:
    jobs: ./packages/py-jobs

# Runtime env for the API process: app DB role + scoped MinIO user only.
x-api-env: &api-env
  ENV: ${ENV:-dev}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MAX_EVIDENCE_BYTES: ${MAX_EVIDENCE_BYTES}
  EVIDENCE_LOCK_DAYS: ${EVIDENCE_LOCK_DAYS}
  UPLOAD_TMP_DIR: ${UPLOAD_TMP_DIR}
  MAX_CONCURRENT_UPLOADS_PER_USER: ${MAX_CONCURRENT_UPLOADS_PER_USER}
  RATE_LIMIT_LOGIN_PER_IP_PER_MIN: ${RATE_LIMIT_LOGIN_PER_IP_PER_MIN}
  RATE_LIMIT_LOGIN_FAILURES_PER_15MIN: ${RATE_LIMIT_LOGIN_FAILURES_PER_15MIN}
  RATE_LIMIT_REGISTER_PER_IP_PER_10MIN: ${RATE_LIMIT_REGISTER_PER_IP_PER_10MIN}
  BROKER_URL: redis://api:${BROKER_API_PASSWORD}@redis-broker:6379/0
  RESULTS_BUCKET: ${RESULTS_BUCKET}
  PCAP_MAX_BYTES: ${PCAP_MAX_BYTES}
  ANALYSIS_TIMEOUT_S: ${ANALYSIS_TIMEOUT_S}
  ANALYSIS_TOOL_TIMEOUT_S: ${ANALYSIS_TOOL_TIMEOUT_S}
  MAX_ACTIVE_ANALYSES_PER_ORG: ${MAX_ACTIVE_ANALYSES_PER_ORG}
  STATIC_MAX_BYTES: ${STATIC_MAX_BYTES:-67108864}
  DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:-21474836480}
  MAX_OWNED_ORGS_PER_USER: ${MAX_OWNED_ORGS_PER_USER:-5}
  PROCESS_ROLE: api
  # No runtime dependency sync: `backend` has no egress (rebuild the image after a change).
  UV_NO_SYNC: "1"
  UV_OFFLINE: "1"
  # Threat intel: the API seals provider keys with the public key only.
  TI_ENABLED: ${TI_ENABLED:-true}
  TI_SEAL_ACTIVE_KID: ${TI_SEAL_ACTIVE_KID}
  TI_SEAL_PUBLIC_KEYS: ${TI_SEAL_PUBLIC_KEYS}
  TI_MOCK_ENABLED: ${TI_MOCK_ENABLED:-true}
  TI_MOCK_BASE_URL: http://ti-mock:8080

# Least-privilege env of the internet-facing enrich worker (M4 RT2). Never merged with
# *api-env: no JWT secret, no MinIO credentials, no app Redis (Settings refuses them when
# PROCESS_ROLE=enrich). Its limiter keys live on the broker, under its own ACL prefix.
x-enrich-env: &enrich-env
  ENV: ${ENV:-dev}
  PROCESS_ROLE: enrich
  DATABASE_URL: ${DATABASE_URL}
  BROKER_URL: redis://enrich:${BROKER_ENRICH_PASSWORD}@redis-broker:6379/0
  QUEUE_PREFIX: ""
  UV_NO_SYNC: "1"
  UV_OFFLINE: "1"
  TI_ENABLED: ${TI_ENABLED:-true}
  TI_SEAL_ACTIVE_KID: ${TI_SEAL_ACTIVE_KID}
  TI_SEAL_PUBLIC_KEYS: ${TI_SEAL_PUBLIC_KEYS}
  TI_SEAL_PRIVATE_KEYS_FILE: /run/secrets/ti_seal_private
  TI_MOCK_ENABLED: ${TI_MOCK_ENABLED:-true}
  TI_MOCK_BASE_URL: http://ti-mock:8080

# Trusted enrich worker (api image): the only service with internet egress. It joins only
# `enrich` (Postgres and the broker, nothing else) and `egress`: never `backend` (app Redis,
# MinIO, the api) nor `analysis` (review M2).
x-enrich-worker: &enrich-worker
  image: cyberlab/api:dev
  pull_policy: never
  user: "10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m
  restart: unless-stopped
  networks: [enrich, egress]
  # The sealing private keys (dev: the committed dev-only pair; prod: .secrets/).
  secrets: [ti_seal_private]

# Untrusted parser container: broker URL only, tools run as an unprivileged uid inside.
x-pcap-worker: &pcap-worker
  image: cyberlab/pcap-worker:dev
  build:
    context: ./apps/workers/pcap
    target: dev
    additional_contexts:
      jobs: ./packages/py-jobs
      worker_kit: ./packages/py-worker-kit
  # tini as PID 1 reaps the orphaned tool processes the worker kills.
  init: true
  read_only: true
  cap_drop: [ALL]
  # Root process keeps only what it needs to run tools as uid 10003 and clean up after them.
  cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  # Root-only scratch space: tools get TMPDIR inside their own job directory instead.
  tmpfs:
    - /tmp:size=64m,mode=1700
    - /dev/shm:size=1m,mode=1700
  # Fail closed: the worker stops its container if a tool process cannot be killed.
  restart: unless-stopped
  networks: [analysis]

# Untrusted static analyzer: same isolation as the pcap worker; more memory (ClamAV DB).
x-static-worker: &static-worker
  image: cyberlab/static-worker:dev
  build:
    context: ./apps/workers/static
    target: dev
    additional_contexts:
      jobs: ./packages/py-jobs
      worker_kit: ./packages/py-worker-kit
  init: true
  read_only: true
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 3g
  cpus: 2
  tmpfs:
    - /tmp:size=64m,mode=1700
    - /dev/shm:size=1m,mode=1700
  restart: unless-stopped
  networks: [analysis]

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
  interval: 5s
  timeout: 5s
  retries: 30

# Networks: the api trusts X-Forwarded-For from any peer, so only the gateway and the
# data services share its network. The web container cannot reach the api directly.
# `backend` has no egress (M4): nothing on it needs the internet at runtime (see
# docs/DEPLOYMENT.md); the gateway publishes through `frontend`.
networks:
  backend:
    internal: true
  frontend:
  # Internet egress for the enrich worker only (and the ti-mock sink in test/e2e).
  egress:
  # The enrich worker's way to its data: Postgres and the broker only, no egress.
  enrich:
    internal: true
  # Parser network: no egress (internal), only the broker and MinIO (presigned URLs) on it.
  analysis:
    internal: true

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend, enrich]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberlab"]
      interval: 3s
      timeout: 3s
      retries: 20
      # Crash recovery after an unclean stop can take a while; don't count it as unhealthy.
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # Upstream MinIO stopped publishing community images; frozen bitnami build (2025-05-24).
    # Dev/learning only: no further security patches (see docs/THREAT_MODEL.md).
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - miniodata:/bitnami/minio/data
    # No console port: MinIO sits on internal networks only, which cannot publish ports.
    # Use `docker compose exec minio mc ...` instead (docs/DEPLOYMENT.md).
    # On `analysis` so the parser can use its presigned URLs (it holds no MinIO credentials).
    networks: [backend, analysis]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s

  minio-init:
    image: bitnamilegacy/minio-client:2025.5.21
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      RESULTS_BUCKET: ${RESULTS_BUCKET}
      RESULTS_TEST_BUCKET: ${RESULTS_TEST_BUCKET}
    volumes:
      - ./infra/minio:/init:ro
    networks: [backend]
    depends_on:
      minio:
        condition: service_healthy

  redis-broker:
    image: redis:7.4-alpine
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    environment:
      BROKER_API_PASSWORD: ${BROKER_API_PASSWORD}
      BROKER_INGEST_PASSWORD: ${BROKER_INGEST_PASSWORD}
      BROKER_PCAP_PASSWORD: ${BROKER_PCAP_PASSWORD}
      BROKER_STATIC_PASSWORD: ${BROKER_STATIC_PASSWORD}
      BROKER_ENRICH_PASSWORD: ${BROKER_ENRICH_PASSWORD}
    volumes:
      - ./infra/redis-broker:/init:ro
    networks: [backend, analysis, enrich]
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "healthcheck", "--pass", "", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    # Reuses the image built by `api` (building the same tag twice in parallel races).
    image: cyberlab/api:dev
    pull_policy: never
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      UV_NO_SYNC: "1"
      UV_OFFLINE: "1"
    volumes:
      - ./apps/api:/srv/api
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: cyberlab/api:dev
    build: *api-build
    environment: *api-env
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
      - upload_tmp:${UPLOAD_TMP_DIR}
    networks: [backend]
    healthcheck: *api-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  # Trusted side of the pipeline: validates analyzer messages/results, writes the DB.
  ingest-worker:
    image: cyberlab/api:dev
    pull_policy: never
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--pool", "solo",
              "--without-gossip", "--without-mingle", "--loglevel", "INFO"]
    environment:
      <<: *api-env
      PROCESS_ROLE: ingest
      BROKER_URL: redis://ingest:${BROKER_INGEST_PASSWORD}@redis-broker:6379/0
      # Result streams (up to 256 MiB compressed) are validated from disk, not tmpfs.
      INGEST_TMP_DIR: /var/lib/cyberlab/ingest-tmp
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
      - ingest_tmp:/var/lib/cyberlab/ingest-tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy

  # Reaper schedule in its own process: a long ingest never delays it (it only enqueues).
  ingest-beat:
    image: cyberlab/api:dev
    pull_policy: never
    command: ["celery", "-A", "app.workers.celery_app", "beat",
              "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    environment:
      <<: *api-env
      PROCESS_ROLE: ingest
      BROKER_URL: redis://ingest:${BROKER_INGEST_PASSWORD}@redis-broker:6379/0
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
    read_only: true
    tmpfs:
      - /tmp:size=16m
    networks: [backend]
    depends_on:
      redis-broker:
        condition: service_healthy

  # Threat intel lookups (M4). Phase 1: consumes `ti.enrich` but has no providers yet.
  enrich-worker:
    <<: *enrich-worker
    command: ["celery", "-A", "app.workers.enrich_app", "worker", "-Q", "enrich",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment: *enrich-env
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy

  static-worker:
    <<: *static-worker
    environment:
      BROKER_URL: redis://static:${BROKER_STATIC_PASSWORD}@redis-broker:6379/0
    volumes:
      - ./apps/workers/static/static_worker:/srv/workers/static/static_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - static_work:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  pcap-worker:
    <<: *pcap-worker
    environment:
      BROKER_URL: redis://pcap:${BROKER_PCAP_PASSWORD}@redis-broker:6379/0
    volumes:
      - ./apps/workers/pcap/pcap_worker:/srv/workers/pcap/pcap_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - pcap_work:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  web:
    image: cyberlab/web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    volumes:
      # Only the web sources: the repo root (with .env) is never mounted here.
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      # Keep the image's Linux node_modules instead of the host's.
      - /repo/apps/web/node_modules
      - /repo/packages/contracts/node_modules
      - /repo/apps/web/.next
    networks: [frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  gateway:
    image: caddy:2.10.2-alpine
    environment:
      CADDY_EVIDENCE_MAX: ${CADDY_EVIDENCE_MAX}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/common.caddy:/etc/caddy/common.caddy:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # --- test profile: owner creds + test DB/bucket/redis db, never used by the running api ---
  api-test:
    profiles: ["test"]
    image: cyberlab/api:dev
    build: *api-build
    environment:
      <<: *api-env
      ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL}
      REDIS_URL: ${TEST_REDIS_URL}
      MINIO_BUCKET: ${MINIO_TEST_BUCKET}
      EVIDENCE_LOCK_DAYS: "0"
      RATE_LIMIT_LOGIN_PER_IP_PER_MIN: "1000"
      RATE_LIMIT_LOGIN_FAILURES_PER_15MIN: "1000"
      RATE_LIMIT_REGISTER_PER_IP_PER_10MIN: "1000"
      TEST_MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL}
      MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL}
      # Test-only: lets storage tests act as an attacker/admin and clean up locked versions.
      TEST_MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      TEST_MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Test jobs: own broker db + queue prefix, so dev workers never see them.
      BROKER_URL: redis://ingest:${BROKER_INGEST_PASSWORD}@redis-broker:6379/1
      QUEUE_PREFIX: "test."
      RESULTS_BUCKET: ${RESULTS_TEST_BUCKET}
      # Lets tests probe the broker ACL as each component's user.
      TEST_BROKER_PCAP_URL: redis://pcap:${BROKER_PCAP_PASSWORD}@redis-broker:6379/1
      TEST_BROKER_STATIC_URL: redis://static:${BROKER_STATIC_PASSWORD}@redis-broker:6379/1
      TEST_BROKER_ENRICH_URL: redis://enrich:${BROKER_ENRICH_PASSWORD}@redis-broker:6379/1
      TEST_BROKER_API_URL: redis://api:${BROKER_API_PASSWORD}@redis-broker:6379/1
      # The key ti-mock expects: the TI pipeline test seals it like an admin would.
      TEST_TI_MOCK_EXPECTED_KEY: ${TI_MOCK_EXPECTED_KEY:-cyberlab-ti-mock-key}
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
      - upload_tmp_test:${UPLOAD_TMP_DIR}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      pcap-worker-test:
        condition: service_started
      static-worker-test:
        condition: service_started
      enrich-worker-test:
        condition: service_started

  enrich-worker-test:
    <<: *enrich-worker
    profiles: ["test"]
    command: ["celery", "-A", "app.workers.enrich_app", "worker", "-Q", "test.enrich",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment:
      <<: *enrich-env
      ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL}
      BROKER_URL: redis://enrich:${BROKER_ENRICH_PASSWORD}@redis-broker:6379/1
      QUEUE_PREFIX: "test."
      TI_MOCK_ENABLED: "true"
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      ti-mock:
        condition: service_started

  # Deterministic provider sink for the `mock` provider (test + e2e only): a stdlib server
  # on the egress network only, so the enrich worker is the only client that can reach it.
  ti-mock:
    profiles: ["test", "e2e"]
    image: python:3.12-alpine
    command: ["python", "/srv/ti-mock/server.py"]
    environment:
      TI_MOCK_EXPECTED_KEY: ${TI_MOCK_EXPECTED_KEY:-cyberlab-ti-mock-key}
    volumes:
      - ./infra/ti-mock:/srv/ti-mock:ro
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  static-worker-test:
    <<: *static-worker
    profiles: ["test"]
    environment:
      BROKER_URL: redis://static:${BROKER_STATIC_PASSWORD}@redis-broker:6379/1
      QUEUE_PREFIX: "test."
      WORKER_QUEUE: static
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    volumes:
      - ./apps/workers/static/static_worker:/srv/workers/static/static_worker:ro
      - ./apps/workers/static/tests:/srv/workers/static/tests:ro
      - ./apps/workers/static/samples:/srv/workers/static/samples:ro
      - ./apps/workers/static/pyproject.toml:/srv/workers/static/pyproject.toml:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - static_work_test:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  pcap-worker-test:
    <<: *pcap-worker
    profiles: ["test"]
    environment:
      BROKER_URL: redis://pcap:${BROKER_PCAP_PASSWORD}@redis-broker:6379/1
      QUEUE_PREFIX: "test."
      # Small local rule file: loading ET Open takes ~40 s per job (one test covers it).
      SURICATA_RULES: /srv/workers/pcap/tests/rules/local-test.rules
      WORKER_QUEUE: pcap
      # Read-only rootfs: lint/type caches go to the tmpfs.
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    volumes:
      - ./apps/workers/pcap/pcap_worker:/srv/workers/pcap/pcap_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - ./apps/workers/pcap/tests:/srv/workers/pcap/tests:ro
      - ./apps/workers/pcap/dataset:/srv/workers/pcap/dataset:ro
      - ./apps/workers/pcap/pyproject.toml:/srv/workers/pcap/pyproject.toml:ro
      - pcap_work_test:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  # --- e2e profile: Playwright against the running stack through the gateway ---
  e2e:
    profiles: ["e2e"]
    image: cyberlab/e2e:dev
    build:
      context: .
      dockerfile: apps/web/e2e/Dockerfile
    environment:
      E2E_BASE_URL: http://gateway:8080
      # The key ti-mock expects: threat-intel.spec.ts stores it as the `mock` provider key
      # (dev only; it also asserts the value never appears in a page).
      E2E_TI_MOCK_KEY: ${TI_MOCK_EXPECTED_KEY:-cyberlab-ti-mock-key}
    volumes:
      # Synthetic captures generated by scripts/e2e.mjs (never committed).
      - ./.e2e-data:/data:ro
    networks: [frontend]
    depends_on:
      gateway:
        condition: service_healthy

secrets:
  # Dev-only seal private key (committed, refused in prod); the prod override swaps the file.
  ti_seal_private:
    file: ./infra/ti/dev-seal-private.json

volumes:
  pgdata:
  miniodata:
  upload_tmp:
  upload_tmp_test:
  pcap_work:
  pcap_work_test:
  ingest_tmp:
  static_work:
  static_work_test:
