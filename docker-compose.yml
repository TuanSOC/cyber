name: cyberlab

x-api-build: &api-build
  context: ./apps/api
  target: dev
  additional_contexts:
    jobs: ./packages/py-jobs

# Runtime env for the API process: app DB role + scoped MinIO user only.
x-api-env: &api-env
  ENV: ${ENV:-dev}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MAX_EVIDENCE_BYTES: ${MAX_EVIDENCE_BYTES}
  EVIDENCE_LOCK_DAYS: ${EVIDENCE_LOCK_DAYS}
  UPLOAD_TMP_DIR: ${UPLOAD_TMP_DIR}
  MAX_CONCURRENT_UPLOADS_PER_USER: ${MAX_CONCURRENT_UPLOADS_PER_USER}
  RATE_LIMIT_LOGIN_PER_IP_PER_MIN: ${RATE_LIMIT_LOGIN_PER_IP_PER_MIN}
  RATE_LIMIT_LOGIN_FAILURES_PER_15MIN: ${RATE_LIMIT_LOGIN_FAILURES_PER_15MIN}
  RATE_LIMIT_REGISTER_PER_IP_PER_10MIN: ${RATE_LIMIT_REGISTER_PER_IP_PER_10MIN}
  BROKER_URL: redis://api:${BROKER_API_PASSWORD}@redis-broker:6379/0
  RESULTS_BUCKET: ${RESULTS_BUCKET}
  PCAP_MAX_BYTES: ${PCAP_MAX_BYTES}
  ANALYSIS_TIMEOUT_S: ${ANALYSIS_TIMEOUT_S}
  ANALYSIS_TOOL_TIMEOUT_S: ${ANALYSIS_TOOL_TIMEOUT_S}
  MAX_ACTIVE_ANALYSES_PER_ORG: ${MAX_ACTIVE_ANALYSES_PER_ORG}
  STATIC_MAX_BYTES: ${STATIC_MAX_BYTES:-67108864}
  DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:-21474836480}
  MAX_OWNED_ORGS_PER_USER: ${MAX_OWNED_ORGS_PER_USER:-5}
  PROCESS_ROLE: api
  # No runtime dependency sync: `backend` has no egress (rebuild the image after a change).
  UV_NO_SYNC: "1"
  UV_OFFLINE: "1"
  # Threat intel: the API seals provider keys with the public key only.
  TI_ENABLED: ${TI_ENABLED:-true}
  TI_SEAL_ACTIVE_KID: ${TI_SEAL_ACTIVE_KID}
  TI_SEAL_PUBLIC_KEYS: ${TI_SEAL_PUBLIC_KEYS}
  TI_MOCK_ENABLED: ${TI_MOCK_ENABLED:-true}
  TI_MOCK_BASE_URL: http://ti-mock:8080
  # AI analyst (M5): the API seals AI provider keys with the AI public key only. The dev
  # defaults are the committed dev pair (infra/ai/dev-seal-private.json), refused in prod.
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_SEAL_ACTIVE_KID: ${AI_SEAL_ACTIVE_KID:-dev-ai-1}
  AI_SEAL_PUBLIC_KEYS: '${AI_SEAL_PUBLIC_KEYS:-{"dev-ai-1":"YqrtDS8h4Q5PCQ0wa+0X7Qy72jDi3HYjQfotX+oH6io="}}'
  AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-true}
  AI_MOCK_BASE_URL: http://ai-mock:8080
  GEMINI_BILLING_ENABLED: ${GEMINI_BILLING_ENABLED:-false}
  # Non-secret: which provider the dev-only platform key overlay covers (empty: none).
  AI_PLATFORM_PROVIDER: ${AI_PLATFORM_PROVIDER:-}
  # Reports (M6): the object-locked report bucket (no default retention, RT6) and the origin
  # printed in front of the internal citation paths (empty: none).
  REPORTS_BUCKET: ${REPORTS_BUCKET:-reports}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  # M7: the global per-user request limit (the e2e raises it) and the retention delay the API
  # applies to a lowered policy, an enforce switch and a hold release (RT1).
  RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-600}
  RETENTION_POLICY_DELAY_DAYS: ${RETENTION_POLICY_DELAY_DAYS:-7}
  # M8 memory forensics: the image cap (<= 16 GiB, RT14; CADDY_EVIDENCE_MAX must cover it),
  # the job timeouts and the active-job caps (a run costs minutes to an hour, GiBs of disk).
  MEMORY_MAX_BYTES: ${MEMORY_MAX_BYTES:-8589934592}
  ANALYSIS_MEMORY_TIMEOUT_S: ${ANALYSIS_MEMORY_TIMEOUT_S:-5400}
  ANALYSIS_MEMORY_PLUGIN_TIMEOUT_S: ${ANALYSIS_MEMORY_PLUGIN_TIMEOUT_S:-1200}
  MEMORY_MAX_ACTIVE_PER_ORG: ${MEMORY_MAX_ACTIVE_PER_ORG:-1}
  MEMORY_MAX_ACTIVE_TOTAL: ${MEMORY_MAX_ACTIVE_TOTAL:-2}

# Least-privilege env of the retention worker (M7). Never merged with *api-env: its DB role is
# `cyberlab_retention` (NOBYPASSRLS), its MinIO user `cyberlab-purge`, its broker user
# `retention`; no JWT secret, app Redis, api MinIO user, seal / signing / platform key or
# metrics token (Settings refuses them when PROCESS_ROLE=retention). The dev passwords default
# to change-me values (an older .env still starts); the prod overlay requires real ones.
x-retention-env: &retention-env
  ENV: ${ENV:-dev}
  PROCESS_ROLE: retention
  DATABASE_URL: postgresql+asyncpg://cyberlab_retention:${POSTGRES_RETENTION_PASSWORD:-change-me-retention}@postgres:5432/cyberlab
  BROKER_URL: redis://retention:${BROKER_RETENTION_PASSWORD:-change-me-broker-retention}@redis-broker:6379/0
  QUEUE_PREFIX: ""
  UV_NO_SYNC: "1"
  UV_OFFLINE: "1"
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_BUCKET: ${MINIO_BUCKET}
  RESULTS_BUCKET: ${RESULTS_BUCKET}
  REPORTS_BUCKET: ${REPORTS_BUCKET:-reports}
  MINIO_PURGE_ACCESS_KEY: ${MINIO_PURGE_ACCESS_KEY:-cyberlab-purge}
  MINIO_PURGE_SECRET_KEY: ${MINIO_PURGE_SECRET_KEY:-change-me-minio-purge}
  EVIDENCE_LOCK_DAYS: ${EVIDENCE_LOCK_DAYS}
  RETENTION_POLICY_DELAY_DAYS: ${RETENTION_POLICY_DELAY_DAYS:-7}

x-retention-worker: &retention-worker
  image: cyberlab/api:dev
  pull_policy: never
  user: "10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m
  mem_limit: 384m
  restart: unless-stopped
  # Postgres, the broker and MinIO only: no egress, no gateway, no analysis network.
  networks: [backend]

# Report signing (M6): the public keys and the active kid, for the api service only (merged
# into its env, never into *api-env: ingest, enrich, analyst and the report renderer carry no
# signing material). The dev defaults are the committed dev pair
# (infra/reports/dev-signing-private.json, kid dev-report-1), refused in prod.
x-report-signing-env: &report-signing-env
  REPORT_SIGNING_ACTIVE_KID: ${REPORT_SIGNING_ACTIVE_KID:-dev-report-1}
  REPORT_SIGNING_PUBLIC_KEYS: '${REPORT_SIGNING_PUBLIC_KEYS:-{"dev-report-1":"zS2iP9napZDeshJwfCiTwYl8amzPuWJEJwHK8CpnF2k="}}'

# Least-privilege env of the internet-facing enrich worker (M4 RT2). Never merged with
# *api-env: no JWT secret, no MinIO credentials, no app Redis (Settings refuses them when
# PROCESS_ROLE=enrich). Its limiter keys live on the broker, under its own ACL prefix.
x-enrich-env: &enrich-env
  ENV: ${ENV:-dev}
  PROCESS_ROLE: enrich
  DATABASE_URL: ${DATABASE_URL}
  BROKER_URL: redis://enrich:${BROKER_ENRICH_PASSWORD}@redis-broker:6379/0
  QUEUE_PREFIX: ""
  UV_NO_SYNC: "1"
  UV_OFFLINE: "1"
  TI_ENABLED: ${TI_ENABLED:-true}
  TI_SEAL_ACTIVE_KID: ${TI_SEAL_ACTIVE_KID}
  TI_SEAL_PUBLIC_KEYS: ${TI_SEAL_PUBLIC_KEYS}
  TI_SEAL_PRIVATE_KEYS_FILE: /run/secrets/ti_seal_private
  TI_MOCK_ENABLED: ${TI_MOCK_ENABLED:-true}
  TI_MOCK_BASE_URL: http://ti-mock:8080

# Least-privilege env of the AI analyst worker (M5). Never merged with *api-env or
# *enrich-env: no JWT secret, MinIO, app Redis or TI private key (Settings refuses them when
# PROCESS_ROLE=analyst). The AI public keys are here for the lazy re-seal (RT18).
x-analyst-env: &analyst-env
  ENV: ${ENV:-dev}
  PROCESS_ROLE: analyst
  DATABASE_URL: ${DATABASE_URL}
  # Default password: an older .env without BROKER_ANALYST_PASSWORD still starts (RT25).
  BROKER_URL: redis://analyst:${BROKER_ANALYST_PASSWORD:-change-me-broker-analyst}@redis-broker:6379/0
  QUEUE_PREFIX: ""
  UV_NO_SYNC: "1"
  UV_OFFLINE: "1"
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_SEAL_ACTIVE_KID: ${AI_SEAL_ACTIVE_KID:-dev-ai-1}
  AI_SEAL_PUBLIC_KEYS: '${AI_SEAL_PUBLIC_KEYS:-{"dev-ai-1":"YqrtDS8h4Q5PCQ0wa+0X7Qy72jDi3HYjQfotX+oH6io="}}'
  AI_SEAL_PRIVATE_KEYS_FILE: /run/secrets/ai_seal_private
  AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-true}
  AI_MOCK_BASE_URL: http://ai-mock:8080
  GEMINI_BILLING_ENABLED: ${GEMINI_BILLING_ENABLED:-false}
  AI_ANTHROPIC_EFFORT: ${AI_ANTHROPIC_EFFORT:-medium}

# Trusted enrich worker (api image): the only service with internet egress. It joins only
# `enrich` (Postgres and the broker, nothing else) and `egress`: never `backend` (app Redis,
# MinIO, the api) nor `analysis` (review M2).
x-enrich-worker: &enrich-worker
  image: cyberlab/api:dev
  pull_policy: never
  user: "10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m
  restart: unless-stopped
  networks: [enrich, egress]
  # The sealing private keys (dev: the committed dev-only pair; prod: .secrets/).
  secrets: [ti_seal_private]

# Trusted AI analyst worker (M5, api image): the same isolation as the enrich worker
# (`enrich` = Postgres + broker only, plus `egress`), with its own key pair and broker user.
# It never gets the enrich worker's TI secret, nor the enrich worker its AI secret.
x-analyst-worker: &analyst-worker
  image: cyberlab/api:dev
  pull_policy: never
  user: "10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m
  restart: unless-stopped
  networks: [enrich, egress]
  secrets: [ai_seal_private]

# Untrusted parser container: broker URL only, tools run as an unprivileged uid inside.
x-pcap-worker: &pcap-worker
  image: cyberlab/pcap-worker:dev
  build:
    context: ./apps/workers/pcap
    target: dev
    additional_contexts:
      jobs: ./packages/py-jobs
      worker_kit: ./packages/py-worker-kit
  # tini as PID 1 reaps the orphaned tool processes the worker kills.
  init: true
  read_only: true
  cap_drop: [ALL]
  # Root process keeps only what it needs to run tools as uid 10003 and clean up after them.
  cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  # Root-only scratch space: tools get TMPDIR inside their own job directory instead.
  tmpfs:
    - /tmp:size=64m,mode=1700
    - /dev/shm:size=1m,mode=1700
  # Fail closed: the worker stops its container if a tool process cannot be killed.
  restart: unless-stopped
  networks: [analysis]

# Untrusted static analyzer: same isolation as the pcap worker; more memory (ClamAV DB).
x-static-worker: &static-worker
  image: cyberlab/static-worker:dev
  build:
    context: ./apps/workers/static
    target: dev
    additional_contexts:
      jobs: ./packages/py-jobs
      worker_kit: ./packages/py-worker-kit
  init: true
  read_only: true
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 3g
  cpus: 2
  tmpfs:
    - /tmp:size=64m,mode=1700
    - /dev/shm:size=1m,mode=1700
  restart: unless-stopped
  networks: [analysis]

# Untrusted report renderer (M6): renders a signed snapshot (attacker-controlled text from
# captures, samples, TI, AI output and analysts) to PDF/A-3a, HTML and Markdown. The static
# worker's isolation: root process with the analyzers' capabilities (it drops the render
# subprocess to its own uid 10004, RT3), `analysis` only (broker + MinIO presigned URLs, no egress),
# env BROKER_URL only (no DB, JWT, MinIO credentials, signing key or app Redis). The render
# work dir is a root-owned tmpfs (`/work`, noexec, RT4).
x-report-worker: &report-worker
  image: cyberlab/report-worker:dev
  build:
    context: ./apps/workers/report
    target: dev
    additional_contexts:
      jobs: ./packages/py-jobs
      worker_kit: ./packages/py-worker-kit
  init: true
  read_only: true
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 1g
  cpus: 1
  tmpfs:
    - /tmp:size=16m,mode=1700
    - /dev/shm:size=1m,mode=1700
    - /work:size=96m,mode=0711,noexec
  restart: unless-stopped
  networks: [analysis]

# Untrusted memory analyzer (M8): Volatility 3 over an attacker-controlled memory image, offline,
# one confined plugin process each (uid 10006, seccomp AF_UNIX only + no io_uring). The static
# worker's isolation: root process with the analyzers' capabilities, `analysis` only (broker +
# MinIO presigned URLs, no egress), env BROKER_URL only (as broker user `memory`). `/work` is a
# named volume (images are GiBs, not a tmpfs) and the symbol store is mounted read-only.
x-memory-worker: &memory-worker
  image: cyberlab/memory-worker:dev
  build:
    context: ./apps/workers/memory
    target: dev
    additional_contexts:
      jobs: ./packages/py-jobs
      worker_kit: ./packages/py-worker-kit
  init: true
  read_only: true
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 3g
  cpus: 2
  tmpfs:
    - /tmp:size=64m,mode=1700
    - /dev/shm:size=1m,mode=1700
  restart: unless-stopped
  networks: [analysis]

# Trusted operator tool (M8): fetches Windows kernel PDBs over verified HTTPS on request and
# imports operator ISFs into the symbol store. Profile `tools` only (never part of `up`), the
# memory image as uid 10005, its own `symbols_egress` network and nothing else: no broker,
# Postgres, MinIO, backend, analysis or shared `egress` network (RT17), no secrets.
x-memory-symbols: &memory-symbols
  image: cyberlab/memory-worker:dev
  pull_policy: never
  profiles: ["tools"]
  user: "10005:10005"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  mem_limit: 2g
  tmpfs:
    - /tmp:size=512m,mode=1777
  entrypoint: ["python", "-I", "-m", "memory_worker.symbols"]
  networks: [symbols_egress]
  depends_on:
    memory-symbols-init:
      condition: service_completed_successfully

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
  interval: 5s
  timeout: 5s
  retries: 30

# Networks: the api trusts X-Forwarded-For from any peer, so only the gateway and the
# data services share its network. The web container cannot reach the api directly.
# `backend` has no egress (M4): nothing on it needs the internet at runtime (see
# docs/DEPLOYMENT.md); the gateway publishes through `frontend`.
networks:
  backend:
    internal: true
  frontend:
  # Internet egress for the enrich and analyst workers only (and the ti-mock / ai-mock
  # sinks in test/e2e).
  egress:
  # The enrich and analyst workers' way to their data: Postgres and the broker only.
  enrich:
    internal: true
  # Parser network: no egress (internal), only the broker and MinIO (presigned URLs) on it.
  analysis:
    internal: true
  # M8: the memory-symbols tool's own way out (Microsoft's symbol server, verified HTTPS),
  # used by nothing else (RT17): not the shared `egress` of the enrich / analyst workers.
  symbols_egress:

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      # M7: init/02-m7-roles.sh (fresh volumes) runs the db-bootstrap script.
      POSTGRES_RETENTION_PASSWORD: ${POSTGRES_RETENTION_PASSWORD:-change-me-retention}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/bootstrap.sh:/opt/cyberlab/bootstrap.sh:ro
    networks: [backend, enrich]
    # A recreate (`up --renew-anon-volumes` in the gate) right after the API suite has written
    # for an hour can need more than the default 10 s to checkpoint: a SIGKILL then forces a
    # crash recovery whose data-directory fsync took over 10 minutes on the dev volume.
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberlab"]
      interval: 3s
      timeout: 3s
      retries: 20
      # Crash recovery after an unclean stop can take a while; don't count it as unhealthy.
      start_period: 300s

  redis:
    image: redis:7.4-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # M7 phase 6 (switched 2026-11-06): pgsty/silo, the maintained on-disk-compatible MinIO fork,
    # through the local wrapper infra/minio/silo/Dockerfile, built FROM the digest-pinned
    # multi-arch index (SLSA provenance: gh attestation verify, see the Dockerfile). The wrapper
    # adds only USER 1001:0 (bitnami's user: the old volume root is root:root 0775) and the server
    # CMD. A fresh clone builds it on the first `up` / `build`: `localhost/` is never pulled
    # (pull_policy never). MINIO_IMAGE / MINIO_DATA_DIR stay parameters for the restore drill's
    # --target-minio-image and the bitnami rollback (plans/reports/minio-switch-runbook-261107.md;
    # bitnami also needs MINIO_READ_ONLY=false). The build refuses to tag any other MINIO_IMAGE
    # (TARGET_IMAGE), so a bitnami value can never become the tag of a Silo build.
    image: ${MINIO_IMAGE:-localhost/cyberlab/silo:RELEASE.2026-10-26T00-00-00Z}
    build:
      context: ./infra/minio/silo
      args:
        SILO_BASE: pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
        TARGET_IMAGE: ${MINIO_IMAGE:-localhost/cyberlab/silo:RELEASE.2026-10-26T00-00-00Z}
    pull_policy: never
    # The wrapper's USER, stated so `config` shows it (also bitnami's own user).
    user: "1001:0"
    read_only: ${MINIO_READ_ONLY:-true}
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      # M7 SSE-S3 (RT7): MinIO's built-in KMS key `<name>:<base64 32 bytes>`. It also encrypts
      # MinIO's own IAM and config: losing or changing it makes the store unreadable (backups
      # record its fingerprint; restore refuses another key). Dev: the committed dev key.
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
    secrets: [minio_kms_key]
    volumes:
      - miniodata:${MINIO_DATA_DIR:-/data}
    # No console port: MinIO sits on internal networks only, which cannot publish ports.
    # Use `docker compose exec minio mc ...` instead (docs/DEPLOYMENT.md).
    # On `analysis` so the parser can use its presigned URLs (it holds no MinIO credentials).
    networks: [backend, analysis]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s

  minio-init:
    image: ${MC_IMAGE:-bitnamilegacy/minio-client:2025.5.21}
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      ENV: ${ENV:-dev}
      MC_CONFIG_DIR: /tmp/.mc
      # M7: SSE-S3 bucket defaults (false: skip) and the retention worker's purge user.
      MINIO_SSE_ENABLED: ${MINIO_SSE_ENABLED:-true}
      MINIO_PURGE_ACCESS_KEY: ${MINIO_PURGE_ACCESS_KEY:-cyberlab-purge}
      MINIO_PURGE_SECRET_KEY: ${MINIO_PURGE_SECRET_KEY:-change-me-minio-purge}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      RESULTS_BUCKET: ${RESULTS_BUCKET}
      RESULTS_TEST_BUCKET: ${RESULTS_TEST_BUCKET}
      REPORTS_BUCKET: ${REPORTS_BUCKET:-reports}
      REPORTS_TEST_BUCKET: ${REPORTS_TEST_BUCKET:-reports-test}
    # Only to refuse the committed dev key name in prod (the key itself is never read).
    secrets: [minio_kms_key]
    volumes:
      - ./infra/minio:/init:ro
    networks: [backend]
    depends_on:
      minio:
        condition: service_healthy

  redis-broker:
    image: redis:7.4-alpine
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    environment:
      BROKER_API_PASSWORD: ${BROKER_API_PASSWORD}
      BROKER_INGEST_PASSWORD: ${BROKER_INGEST_PASSWORD}
      BROKER_PCAP_PASSWORD: ${BROKER_PCAP_PASSWORD}
      BROKER_STATIC_PASSWORD: ${BROKER_STATIC_PASSWORD}
      BROKER_ENRICH_PASSWORD: ${BROKER_ENRICH_PASSWORD}
      # Default: an older .env without it must not crash the broker (RT25); prod requires it.
      BROKER_ANALYST_PASSWORD: ${BROKER_ANALYST_PASSWORD:-change-me-broker-analyst}
      # M6 report renderer: the same default rule (an older .env still starts).
      BROKER_REPORT_PASSWORD: ${BROKER_REPORT_PASSWORD:-change-me-broker-report}
      # M7 retention worker: the same default rule.
      BROKER_RETENTION_PASSWORD: ${BROKER_RETENTION_PASSWORD:-change-me-broker-retention}
      # M8 memory analyzer: the same default rule.
      BROKER_MEMORY_PASSWORD: ${BROKER_MEMORY_PASSWORD:-change-me-broker-memory}
    volumes:
      - ./infra/redis-broker:/init:ro
    networks: [backend, analysis, enrich]
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "healthcheck", "--pass", "", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # M7: idempotent role bootstrap (superuser) for existing volumes, lanes and restores:
  # creates / updates `cyberlab_retention` (infra/postgres/bootstrap.sh). 0014 needs it.
  db-bootstrap:
    image: postgres:17.11-alpine
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_RETENTION_PASSWORD: ${POSTGRES_RETENTION_PASSWORD:-change-me-retention}
    volumes:
      - ./infra/postgres/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    # Reuses the image built by `api` (building the same tag twice in parallel races).
    image: cyberlab/api:dev
    pull_policy: never
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      UV_NO_SYNC: "1"
      UV_OFFLINE: "1"
    volumes:
      - ./apps/api:/srv/api
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully

  api:
    image: cyberlab/api:dev
    build: *api-build
    environment:
      <<: [*api-env, *report-signing-env]
      # The report signing private key (M6): a secret of the api role only.
      REPORT_SIGNING_KEYS_FILE: /run/secrets/report_signing_private
      # M7: the bearer token of GET /internal/metrics (dev: an empty file = endpoint off).
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [report_signing_private, metrics_token]
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
      - upload_tmp:${UPLOAD_TMP_DIR}
    networks: [backend]
    healthcheck: *api-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  # Trusted side of the pipeline: validates analyzer messages/results, writes the DB.
  ingest-worker:
    image: cyberlab/api:dev
    pull_policy: never
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--pool", "solo",
              "--without-gossip", "--without-mingle", "--loglevel", "INFO"]
    environment:
      <<: *api-env
      PROCESS_ROLE: ingest
      BROKER_URL: redis://ingest:${BROKER_INGEST_PASSWORD}@redis-broker:6379/0
      # Result streams (up to 256 MiB compressed) are validated from disk, not tmpfs.
      INGEST_TMP_DIR: /var/lib/cyberlab/ingest-tmp
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
      - ingest_tmp:/var/lib/cyberlab/ingest-tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m
    restart: unless-stopped
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy

  # Reaper schedule in its own process: a long ingest never delays it (it only enqueues).
  ingest-beat:
    image: cyberlab/api:dev
    pull_policy: never
    command: ["celery", "-A", "app.workers.celery_app", "beat",
              "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    environment:
      <<: *api-env
      PROCESS_ROLE: ingest
      BROKER_URL: redis://ingest:${BROKER_INGEST_PASSWORD}@redis-broker:6379/0
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
    read_only: true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    networks: [backend]
    depends_on:
      redis-broker:
        condition: service_healthy

  # Threat intel lookups (M4). Phase 1: consumes `ti.enrich` but has no providers yet.
  enrich-worker:
    <<: *enrich-worker
    command: ["celery", "-A", "app.workers.enrich_app", "worker", "-Q", "enrich",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment: *enrich-env
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy

  # AI analyst (M5): consumes `ai.run` / `ai.resume` / `ai.verify` on the `analyst` queue,
  # calls the org's provider over `egress` and writes verified outputs (docs/AI_ANALYST.md).
  analyst-worker:
    <<: *analyst-worker
    command: ["celery", "-A", "app.workers.analyst_app", "worker", "-Q", "analyst",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment: *analyst-env
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy

  static-worker:
    <<: *static-worker
    environment:
      BROKER_URL: redis://static:${BROKER_STATIC_PASSWORD}@redis-broker:6379/0
    volumes:
      - ./apps/workers/static/static_worker:/srv/workers/static/static_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - static_work:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  pcap-worker:
    <<: *pcap-worker
    environment:
      BROKER_URL: redis://pcap:${BROKER_PCAP_PASSWORD}@redis-broker:6379/0
    volumes:
      - ./apps/workers/pcap/pcap_worker:/srv/workers/pcap/pcap_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - pcap_work:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  # Memory analyzer (M8): consumes `memory.analyze` (queue `memory`). Phase 1: every job fails
  # `not_implemented` (the Volatility runner lands in phase 2).
  memory-worker:
    <<: *memory-worker
    environment:
      BROKER_URL: redis://memory:${BROKER_MEMORY_PASSWORD:-change-me-broker-memory}@redis-broker:6379/0
    volumes:
      - ./apps/workers/memory/memory_worker:/srv/workers/memory/memory_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - memory_work:/work
      - memory_symbols:/symbols:ro
    depends_on:
      redis-broker:
        condition: service_healthy

  # The symbol volumes are owned by the tool's uid 10005 and world-readable (the worker reads
  # them read-only as root and as uid 10006). One-shot, profile `tools`, no network.
  memory-symbols-init:
    image: cyberlab/memory-worker:dev
    pull_policy: never
    profiles: ["tools"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 10005:10005 /symbols /symbols-test && chmod 0755 /symbols /symbols-test"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes:
      - memory_symbols:/symbols
      - memory_symbols_test:/symbols-test

  # `pnpm memory:symbols -- <command>`: the operator's symbol store (rw at /symbols) and the
  # read-only import dir `./.memory-import` (operator-built ISFs and local ISF zips).
  memory-symbols:
    <<: *memory-symbols
    volumes:
      - memory_symbols:/symbols
      - ./.memory-import:/import:ro

  # `pnpm memory:symbols -- --store test <command>`: the same tool on the test store, mounted
  # at /symbols too, so `reindex` always records `file:///symbols/...` locations (RT5).
  memory-symbols-test:
    <<: *memory-symbols
    volumes:
      - memory_symbols_test:/symbols
      - ./.memory-import:/import:ro

  # Report renderer (M6): consumes `report.render` (queue `report`), renders the signed
  # snapshot in its sandboxed subprocess, uploads the artifact through the presigned POST
  # and answers `report.rendered` on `ingest` (the ingest worker re-hashes and records it).
  report-worker:
    <<: *report-worker
    environment:
      BROKER_URL: redis://report:${BROKER_REPORT_PASSWORD:-change-me-broker-report}@redis-broker:6379/0
    volumes:
      - ./apps/workers/report/report_worker:/srv/workers/report/report_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
    depends_on:
      redis-broker:
        condition: service_healthy

  # Retention (M7): consumes `retention.sweep` (beat, daily), `retention.run_org` (manual runs)
  # and `retention.sync_holds` (S3 legal-hold mirror) on the `retention` queue. Dry-run unless
  # the DB says enforce is effective (RT1). Phase 1: the tasks are stubs (nothing to do).
  retention-worker:
    <<: *retention-worker
    command: ["celery", "-A", "app.workers.retention_app", "worker", "-Q", "retention",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment: *retention-env
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy

  web:
    image: cyberlab/web:dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    volumes:
      # Only the web sources: the repo root (with .env) is never mounted here.
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      # Keep the image's Linux node_modules instead of the host's.
      - /repo/apps/web/node_modules
      - /repo/packages/contracts/node_modules
      - /repo/apps/web/.next
    networks: [frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

  gateway:
    image: caddy:2.10.2-alpine
    environment:
      CADDY_EVIDENCE_MAX: ${CADDY_EVIDENCE_MAX}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/common.caddy:/etc/caddy/common.caddy:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # --- test profile: owner creds + test DB/bucket/redis db, never used by the running api ---
  api-test:
    profiles: ["test"]
    image: cyberlab/api:dev
    build: *api-build
    environment:
      <<: *api-env
      ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL}
      REDIS_URL: ${TEST_REDIS_URL}
      MINIO_BUCKET: ${MINIO_TEST_BUCKET}
      EVIDENCE_LOCK_DAYS: "0"
      RATE_LIMIT_LOGIN_PER_IP_PER_MIN: "1000"
      RATE_LIMIT_LOGIN_FAILURES_PER_15MIN: "1000"
      RATE_LIMIT_REGISTER_PER_IP_PER_10MIN: "1000"
      TEST_MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL}
      MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL}
      # Test-only: lets storage tests act as an attacker/admin and clean up locked versions.
      TEST_MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      TEST_MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Test jobs: own broker db + queue prefix, so dev workers never see them.
      BROKER_URL: redis://ingest:${BROKER_INGEST_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      RESULTS_BUCKET: ${RESULTS_TEST_BUCKET}
      # Lets tests probe the broker ACL as each component's user.
      TEST_BROKER_PCAP_URL: redis://pcap:${BROKER_PCAP_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      TEST_BROKER_STATIC_URL: redis://static:${BROKER_STATIC_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      TEST_BROKER_ENRICH_URL: redis://enrich:${BROKER_ENRICH_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      TEST_BROKER_API_URL: redis://api:${BROKER_API_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      TEST_BROKER_ANALYST_URL: redis://analyst:${BROKER_ANALYST_PASSWORD:-change-me-broker-analyst}@redis-broker:6379/${TEST_BROKER_DB:-1}
      # The key ti-mock expects: the TI pipeline test seals it like an admin would.
      TEST_TI_MOCK_EXPECTED_KEY: ${TI_MOCK_EXPECTED_KEY:-cyberlab-ti-mock-key}
      # The key ai-mock expects (the AI pipeline tests seal it like an admin would).
      TEST_AI_MOCK_EXPECTED_KEY: ${AI_MOCK_EXPECTED_KEY:-cyberlab-ai-mock-key}
      TEST_AI_MOCK_STATE_FILE: /srv/ai-mock-state/ai-mock-last.json
      # M6: reports go to the test bucket (lifecycle rule, purged by the tests, RT6); the
      # signing public keys are the dev ones, and no private key file is set (the report
      # tests install their own pair, tests/report_helpers.py: use_signing_keys).
      REPORTS_BUCKET: ${REPORTS_TEST_BUCKET:-reports-test}
      REPORT_SIGNING_ACTIVE_KID: dev-report-1
      REPORT_SIGNING_PUBLIC_KEYS: '{"dev-report-1":"zS2iP9napZDeshJwfCiTwYl8amzPuWJEJwHK8CpnF2k="}'
      TEST_BROKER_REPORT_URL: redis://report:${BROKER_REPORT_PASSWORD:-change-me-broker-report}@redis-broker:6379/${TEST_BROKER_DB:-1}
      # M7: the retention role on the test DB (phase 3 runs the purge in-process with it;
      # scripts/lane-test.sh points it at the lane DB, RT15), the purge MinIO user, the
      # retention broker user, and high per-user limits (RT14: no anonymous limiter). These are
      # TEST_* names: Settings never reads them, so the api-role checks still hold (RT27).
      RETENTION_TEST_DATABASE_URL: postgresql+asyncpg://cyberlab_retention:${POSTGRES_RETENTION_PASSWORD:-change-me-retention}@postgres:5432/cyberlab_test
      TEST_MINIO_PURGE_ACCESS_KEY: ${MINIO_PURGE_ACCESS_KEY:-cyberlab-purge}
      TEST_MINIO_PURGE_SECRET_KEY: ${MINIO_PURGE_SECRET_KEY:-change-me-minio-purge}
      TEST_BROKER_RETENTION_URL: redis://retention:${BROKER_RETENTION_PASSWORD:-change-me-broker-retention}@redis-broker:6379/${TEST_BROKER_DB:-1}
      RATE_LIMIT_USER_PER_MIN: "100000"
      # M8: a small memory cap for the intake tests (never more than 64 MiB uploaded), high
      # active-job caps (tests create many jobs) and the memory analyzer's broker user.
      MEMORY_MAX_BYTES: "67108864"
      MEMORY_MAX_ACTIVE_PER_ORG: "100"
      MEMORY_MAX_ACTIVE_TOTAL: "1000"
      TEST_BROKER_MEMORY_URL: redis://memory:${BROKER_MEMORY_PASSWORD:-change-me-broker-memory}@redis-broker:6379/${TEST_BROKER_DB:-1}
    volumes:
      - ./apps/api:/srv/api
      - ./packages/py-jobs:/packages/py-jobs
      - upload_tmp_test:${UPLOAD_TMP_DIR}
      # The ai-mock server's own unit tests import it in-process.
      - ./infra/ai-mock:/srv/ai-mock:ro
      # The repository scripts (tests/unit/test_verify_report_script.py runs
      # scripts/verify_report.py); read-only.
      - ./scripts:/srv/scripts:ro
      # What ai-mock received (outbound-privacy and call-count assertions); read-only.
      - ai_mock_state:/srv/ai-mock-state:ro
      # The gateway config (M7: test_internal_metrics.py checks it never routes /internal/*).
      - ./infra/caddy:/srv/infra/caddy:ro
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      pcap-worker-test:
        condition: service_started
      static-worker-test:
        condition: service_started
      enrich-worker-test:
        condition: service_started
      analyst-worker-test:
        condition: service_started

  enrich-worker-test:
    <<: *enrich-worker
    profiles: ["test"]
    command: ["celery", "-A", "app.workers.enrich_app", "worker", "-Q", "test.enrich",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment:
      <<: *enrich-env
      ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL}
      BROKER_URL: redis://enrich:${BROKER_ENRICH_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      TI_MOCK_ENABLED: "true"
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      ti-mock:
        condition: service_started

  analyst-worker-test:
    <<: *analyst-worker
    profiles: ["test"]
    command: ["celery", "-A", "app.workers.analyst_app", "worker", "-Q", "test.analyst",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment:
      <<: *analyst-env
      ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL}
      BROKER_URL: redis://analyst:${BROKER_ANALYST_PASSWORD:-change-me-broker-analyst}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      AI_MOCK_ENABLED: "true"
      # Short, so the pipeline tests can time a call out (ai-mock:slow) in seconds (RT2).
      AI_CALL_TIMEOUT_S: "8"
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      ai-mock:
        condition: service_started

  # Deterministic LLM sink for the AI `mock` provider (test + e2e only; phase 2 implements
  # the wire protocol documented in app/modules/ai/contracts.py). A stdlib server on
  # `egress` only, so the analyst worker is the only client that can reach it.
  ai-mock:
    profiles: ["test", "e2e"]
    image: python:3.12-alpine
    command: ["python", "/srv/ai-mock/server.py"]
    environment:
      AI_MOCK_EXPECTED_KEY: ${AI_MOCK_EXPECTED_KEY:-cyberlab-ai-mock-key}
      # The /_last snapshot mirrored to a file: api-test cannot reach this server (egress
      # only), so the AI pipeline tests read the request bodies through a read-only volume.
      AI_MOCK_STATE_FILE: /tmp/ai-mock-last.json
    volumes:
      - ./infra/ai-mock:/srv/ai-mock:ro
      # Mounted on /tmp so the new volume takes the image's 1777 mode (the sink runs as nobody).
      - ai_mock_state:/tmp
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Deterministic provider sink for the `mock` provider (test + e2e only): a stdlib server
  # on the egress network only, so the enrich worker is the only client that can reach it.
  ti-mock:
    profiles: ["test", "e2e"]
    image: python:3.12-alpine
    command: ["python", "/srv/ti-mock/server.py"]
    environment:
      TI_MOCK_EXPECTED_KEY: ${TI_MOCK_EXPECTED_KEY:-cyberlab-ti-mock-key}
    volumes:
      - ./infra/ti-mock:/srv/ti-mock:ro
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  static-worker-test:
    <<: *static-worker
    profiles: ["test"]
    environment:
      BROKER_URL: redis://static:${BROKER_STATIC_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      WORKER_QUEUE: static
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    volumes:
      - ./apps/workers/static/static_worker:/srv/workers/static/static_worker:ro
      - ./apps/workers/static/tests:/srv/workers/static/tests:ro
      - ./apps/workers/static/samples:/srv/workers/static/samples:ro
      - ./apps/workers/static/pyproject.toml:/srv/workers/static/pyproject.toml:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - static_work_test:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  pcap-worker-test:
    <<: *pcap-worker
    profiles: ["test"]
    environment:
      BROKER_URL: redis://pcap:${BROKER_PCAP_PASSWORD}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      # Small local rule file: loading ET Open takes ~40 s per job (one test covers it).
      SURICATA_RULES: /srv/workers/pcap/tests/rules/local-test.rules
      WORKER_QUEUE: pcap
      # Read-only rootfs: lint/type caches go to the tmpfs.
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    volumes:
      - ./apps/workers/pcap/pcap_worker:/srv/workers/pcap/pcap_worker:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - ./apps/workers/pcap/tests:/srv/workers/pcap/tests:ro
      - ./apps/workers/pcap/dataset:/srv/workers/pcap/dataset:ro
      - ./apps/workers/pcap/pyproject.toml:/srv/workers/pcap/pyproject.toml:ro
      - pcap_work_test:/work
    depends_on:
      redis-broker:
        condition: service_healthy

  # Report renderer tests (M6): run through `scripts/lane-test.sh <lane> --service
  # report-worker-test pytest -q tests/` (same slot lock as api-test, RT21). Not a dependency
  # of api-test (about 1 GB): the end-to-end render test starts it explicitly.
  report-worker-test:
    <<: *report-worker
    profiles: ["test"]
    environment:
      BROKER_URL: redis://report:${BROKER_REPORT_PASSWORD:-change-me-broker-report}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      WORKER_QUEUE: report
      RUFF_CACHE_DIR: /tmp/ruff
      # /tmp is only 16 MiB here and the mypy cache does not fit: /dev/null disables it.
      MYPY_CACHE_DIR: /dev/null
    volumes:
      - ./apps/workers/report/report_worker:/srv/workers/report/report_worker:ro
      - ./apps/workers/report/tests:/srv/workers/report/tests:ro
      - ./apps/workers/report/pyproject.toml:/srv/workers/report/pyproject.toml:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
    depends_on:
      redis-broker:
        condition: service_healthy

  # Memory analyzer tests (M8): `scripts/lane-test.sh <lane> --service memory-worker-test
  # [--heavy] pytest -q tests/` (broker db only). `/work` is a per-container tmpfs (sparse files
  # cost nothing), so concurrent lanes never share or reset each other's work dir (RT6); the
  # test symbol store is used only by phase 11's pipeline run (tests build temp stores). Not a
  # dependency of api-test.
  memory-worker-test:
    <<: *memory-worker
    profiles: ["test"]
    environment:
      BROKER_URL: redis://memory:${BROKER_MEMORY_PASSWORD:-change-me-broker-memory}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      WORKER_QUEUE: memory
      # The replay engine (hand-written rows) is refused unless this is set (test profile).
      TEST_PROFILE: "1"
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    tmpfs:
      - /tmp:size=64m,mode=1700
      - /dev/shm:size=1m,mode=1700
      - /work:size=512m,mode=0711
    volumes:
      - ./apps/workers/memory/memory_worker:/srv/workers/memory/memory_worker:ro
      - ./apps/workers/memory/tests:/srv/workers/memory/tests:ro
      - ./apps/workers/memory/samples:/srv/workers/memory/samples:ro
      - ./apps/workers/memory/dataset:/srv/workers/memory/dataset:ro
      - ./apps/workers/memory/pyproject.toml:/srv/workers/memory/pyproject.toml:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
      - ./packages/py-worker-kit:/packages/py-worker-kit:ro
      - memory_symbols_test:/symbols:ro
    depends_on:
      redis-broker:
        condition: service_healthy

  # Retention worker tests (M7): the test DB (retention role), the test buckets and the lane's
  # broker db with the `test.` prefix. Not a dependency of api-test (memory): phase 3 runs the
  # purge in-process in api-test; phase 11 starts this one explicitly.
  retention-worker-test:
    <<: *retention-worker
    profiles: ["test"]
    command: ["celery", "-A", "app.workers.retention_app", "worker", "-Q", "test.retention",
              "--pool", "solo", "--without-gossip", "--without-mingle", "--without-heartbeat",
              "--loglevel", "INFO"]
    environment:
      <<: *retention-env
      ENV: test
      DATABASE_URL: postgresql+asyncpg://cyberlab_retention:${POSTGRES_RETENTION_PASSWORD:-change-me-retention}@postgres:5432/cyberlab_test
      BROKER_URL: redis://retention:${BROKER_RETENTION_PASSWORD:-change-me-broker-retention}@redis-broker:6379/${TEST_BROKER_DB:-1}
      QUEUE_PREFIX: "test."
      MINIO_BUCKET: ${MINIO_TEST_BUCKET}
      RESULTS_BUCKET: ${RESULTS_TEST_BUCKET}
      REPORTS_BUCKET: ${REPORTS_TEST_BUCKET:-reports-test}
      EVIDENCE_LOCK_DAYS: "0"
    volumes:
      - ./apps/api:/srv/api:ro
      - ./packages/py-jobs:/packages/py-jobs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy

  # --- e2e profile: Playwright against the running stack through the gateway ---
  e2e:
    profiles: ["e2e"]
    image: cyberlab/e2e:dev
    build:
      context: .
      dockerfile: apps/web/e2e/Dockerfile
    environment:
      E2E_BASE_URL: http://gateway:8080
      # The key ti-mock expects: threat-intel.spec.ts stores it as the `mock` provider key
      # (dev only; it also asserts the value never appears in a page).
      E2E_TI_MOCK_KEY: ${TI_MOCK_EXPECTED_KEY:-cyberlab-ti-mock-key}
      # The same for the AI `mock` provider key ai-mock expects (ai-analyst.spec.ts).
      E2E_AI_MOCK_KEY: ${AI_MOCK_EXPECTED_KEY:-cyberlab-ai-mock-key}
    volumes:
      # Synthetic captures + executables generated by scripts/e2e.mjs into a named volume
      # (never on the host disk: host AV quarantines the packer-marker sample).
      - e2e_samples:/data:ro
    networks: [frontend]
    depends_on:
      gateway:
        condition: service_healthy

secrets:
  # Dev-only seal private key (committed, refused in prod); the prod override swaps the file.
  ti_seal_private:
    file: ./infra/ti/dev-seal-private.json
  # Dev-only AI seal private key (committed kid dev-ai-1, refused in prod); same rules.
  ai_seal_private:
    file: ./infra/ai/dev-seal-private.json
  # Dev-only report signing private key (committed kid dev-report-1, refused in prod); the
  # api service only. The prod override swaps the file.
  report_signing_private:
    file: ./infra/reports/dev-signing-private.json
  # M7: the dev-only MinIO KMS key (committed, key name `cyberlab-dev-kms`, refused in prod by
  # minio-init); the prod override swaps the file for .secrets/minio_kms_key.
  minio_kms_key:
    file: ./infra/minio/dev-kms-key
  # M7: the bearer token of /internal/metrics. Dev: an empty file (the endpoint answers 404);
  # put a token in .secrets/metrics_token and point METRICS_TOKEN_SECRET_FILE at it to scrape.
  metrics_token:
    file: ${METRICS_TOKEN_SECRET_FILE:-./infra/ops/dev-metrics-token}

volumes:
  pgdata:
  miniodata:
  upload_tmp:
  upload_tmp_test:
  pcap_work:
  pcap_work_test:
  ingest_tmp:
  static_work:
  static_work_test:
  # M8: the memory worker's scratch (an image can be GiBs) and the symbol stores (written only
  # by memory-symbols; read-only in the workers). No corpus volume (parent decision).
  memory_work:
  memory_symbols:
  memory_symbols_test:
  # ai-mock's test-only request mirror (its /tmp; read-only in api-test): see ai-mock.
  ai_mock_state:
  # Created and refreshed by scripts/e2e.mjs (fixed name so the script can address it).
  e2e_samples:
    name: cyberlab_e2e_samples
    external: true
